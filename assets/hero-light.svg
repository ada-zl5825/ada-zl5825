<svg xmlns="http://www.w3.org/2000/svg" width="880" height="268" viewBox="0 0 880 268" role="img" aria-label="Zhifeng Li">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#4f46e5;#0891b2;#0284c7" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#4f46e5">
        <animate attributeName="stop-color" values="#4f46e5;#0891b2;#0284c7;#4f46e5" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e5e5e5" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="880" height="268" fill="#f6f6f4"/>
  <rect width="880" height="268" fill="url(#grid)" opacity="0.7"/>
  <rect width="880" height="3" fill="url(#aurora)"/>

  <circle cx="140" cy="70" r="90" fill="url(#orb)">
    <animate attributeName="cx" values="140;210;140" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;120;70" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="190" r="110" fill="url(#orb)" opacity="0.75">
    <animate attributeName="cx" values="720;650;720" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;130;190" dur="13s" repeatCount="indefinite"/>
  </circle>

  <rect x="28" y="28" width="824" height="212" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
  <circle cx="52" cy="50" r="5" fill="#f87171"/>
  <circle cx="70" cy="50" r="5" fill="#fbbf24"/>
  <circle cx="88" cy="50" r="5" fill="#34d399"/>
  <text x="112" y="55" fill="#737373" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12">zhifeng@london  acse</text>

  <text x="48" y="96" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="13">$ whoami</text>
  <text x="48" y="122" fill="#111111" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700">Zhifeng Li</text>
  <text x="48" y="154" fill="#404040" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16">AI/ML Engineer &amp; Computational Scientist</text>
  <text x="48" y="186" fill="#737373" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="13">London · Imperial College London · Microsoft Core AI</text>
  <text x="48" y="214" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="13">$ focus</text>
  <text x="118" y="214" fill="#262626" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="13">evidence-grounded RAG · scientific computing</text>
  <rect x="456" y="202" width="8" height="16" fill="#0284c7">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
